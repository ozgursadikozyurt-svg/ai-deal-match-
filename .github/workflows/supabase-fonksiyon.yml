# Anahtar CRM v3.42 · 23 Ekim 2026
# main'e her gönderimde sunucu kodunu Supabase Edge Function "api" olarak paketler ve yükler (ücretsiz plan mimarisi; bkz. src/canli/uzak.ts).
# Bir kez gerekli: GitHub › Settings › Secrets and variables › Actions › SUPABASE_ACCESS_TOKEN (Supabase › Account › Access Tokens).
name: Supabase fonksiyonu (api)
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: supabase-fonksiyon
  cancel-in-progress: true
jobs:
  yayinla:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJE: nhizjkeefbxafvncszow
    steps:
      - uses: actions/checkout@v4
      - name: Anahtar var mı?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN eklenmemiş. GitHub › Settings › Secrets and variables › Actions › New repository secret"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Paketle
        run: npm run fonksiyon:paketle
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Supabase'e yükle
        run: |
          set +e
          supabase functions deploy api --project-ref "$SUPABASE_PROJE" --no-verify-jwt --use-docker > /tmp/yukle.log 2>&1
          kod=$?
          cat /tmp/yukle.log
          if [ $kod -ne 0 ]; then
            # hata özetini uyarı olarak da yaz (kayıtlara erişilemeyen yerlerden okunabilsin)
            ozet=$(tail -25 /tmp/yukle.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Supabase yükleme hatası::$ozet"
            exit $kod
          fi
      - name: Ayakta mı?
        run: |
          sleep 5
          kod=$(curl -s -o /tmp/y.json -w "%{http_code}" "https://$SUPABASE_PROJE.supabase.co/functions/v1/api/durum")
          cat /tmp/y.json; echo
          # oturumsuz istek uygulamanın kendi 401'ini almalı (fonksiyon açıldı ve rota çalıştı demektir)
          [ "$kod" = "401" ] || { echo "::error::Fonksiyon beklenen yanıtı vermedi ($kod)"; exit 1; }
      - name: Uçtan uca (anahtarcrm.com → Cloudflare → Supabase → veritabanı)
        continue-on-error: true
        run: |
          # Cloudflare'in yeni sürümü birkaç dakika sonra devreye girebilir: 4 dakikaya kadar dener. Sonuç not olarak yazılır.
          for i in $(seq 1 16); do
            kod=$(curl -s -D /tmp/b.txt -o /tmp/g.txt -w "%{http_code}" https://anahtarcrm.com/api/saglik)
            sunucu=$(grep -i "^x-anahtar-sunucu" /tmp/b.txt | tr -d '\r' | cut -d' ' -f2)
            kapi=$(grep -i "^x-anahtar-kapi-durum" /tmp/b.txt | tr -d '\r' | cut -d' ' -f2)
            [ "$sunucu" = "supabase" ] && break
            sleep 15
          done
          echo "::notice title=Uçtan uca::HTTP $kod · sunucu=${sunucu:-cloudflare} · kapı=${kapi:-?} · $(head -c 300 /tmp/g.txt)"
